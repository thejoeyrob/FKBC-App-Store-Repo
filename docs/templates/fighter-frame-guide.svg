<svg
  xmlns="http://www.w3.org/2000/svg"
  width="384"
  height="256"
  viewBox="0 0 384 256"
>
  <title>FKBC fighter frame guide: 384 by 256, root 192 224</title>
  <desc>
    Technical guide only. Cyan standing collision reference is 54 by 132; yellow
    crouch reference is 54 by 78. Red rectangle illustrates current standing HK
    reach. Remove all guides from exported sprites.
  </desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#28374b" stroke-width=".5" />
    </pattern>
  </defs>
  <rect width="384" height="256" fill="#0b1424" />
  <rect width="384" height="256" fill="url(#grid)" />
  <rect x=".5" y=".5" width="383" height="255" fill="none" stroke="#8093ac" />
  <g font-family="monospace" font-size="8" fill="#dde8f6">
    <text x="12" y="16">384 × 256 SOURCE CELL · RIGHT-FACING</text>
    <text x="12" y="29">GUIDES ONLY — DO NOT EXPORT WITH SPRITE</text>
  </g>
  <path
    d="M192 38V256 M0 224H384"
    fill="none"
    stroke="#c5fb76"
    stroke-dasharray="4 3"
  />
  <rect
    x="165"
    y="92"
    width="54"
    height="132"
    fill="#65d4ed"
    fill-opacity=".08"
    stroke="#65d4ed"
  />
  <rect
    x="165"
    y="146"
    width="54"
    height="78"
    fill="none"
    stroke="#ffda75"
    stroke-dasharray="3 2"
  />
  <rect
    x="204"
    y="124"
    width="148"
    height="44"
    fill="#ff4560"
    fill-opacity=".08"
    stroke="#ff4560"
  />
  <circle cx="192" cy="224" r="4" fill="#c5fb76" />
  <path d="M183 224H201 M192 215V233" stroke="#ffffff" />
  <g font-family="monospace" font-size="8">
    <text x="12" y="78" fill="#65d4ed">STAND: 54 × 132</text>
    <text x="12" y="91" fill="#ffda75">CROUCH: 54 × 78</text>
    <text x="235" y="117" fill="#ff4560">HK CONTACT REF.</text>
    <text x="204" y="211" fill="#c5fb76">ROOT (192,224)</text>
    <text x="12" y="247" fill="#9bafc9">
      Silhouette ≈126–132 px high; transparent margins
    </text>
  </g>
</svg>
